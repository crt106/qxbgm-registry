name: validate-entries

on:
  pull_request:
    paths: ["index/**"]
  push:
    paths: ["index/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate registry entries (schema + URL + sha256)
        run: python ci/validate.py
